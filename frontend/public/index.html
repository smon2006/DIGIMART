<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#000000" />
  <meta name="description" content="Web site created using create-react-app" />
  <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
  <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
  <title>DigiMart | Online Shopping</title>
  <style>
    #initial-loader {
      position: fixed;
      inset: 0;
      z-index: 99999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 22px;
      background: #ffffff;
      transition: opacity 0.4s ease, visibility 0.4s ease;
    }

    #initial-loader.fade-out {
      opacity: 0;
      visibility: hidden;
    }

    #initial-loader .il-logo {
      height: 48px;
      width: auto;
      object-fit: contain;
      filter: drop-shadow(2px 0 0 #000) drop-shadow(-2px 0 0 #000) drop-shadow(0 2px 0 #000) drop-shadow(0 -2px 0 #000) drop-shadow(1.6px 1.6px 0 #000) drop-shadow(-1.6px -1.6px 0 #000) drop-shadow(1.6px -1.6px 0 #000) drop-shadow(-1.6px 1.6px 0 #000);
    }

    #initial-loader .il-ring {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: 4px solid rgba(37, 99, 235, 0.15);
      border-top-color: #2563EB;
      animation: il-spin 0.8s linear infinite;
    }

    @keyframes il-spin {
      to {
        transform: rotate(360deg);
      }
    }
  </style>
</head>

<body>
  <noscript>You need to enable JavaScript to run this app.</noscript>
  <div id="initial-loader">
    <img class="il-logo" src="%PUBLIC_URL%/images/logo.png" alt="DigiMart" />
    <div class="il-ring"></div>
  </div>
  <div id="root"></div>
</body>

</html>
